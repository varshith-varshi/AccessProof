# Install this file in the reverse proxy's http{} configuration. TLS certificates
# are intentionally managed outside this repository (for example, Certbot).
# `web` and `api` are the service names from docker-compose.production.yml and
# must resolve on the proxy Docker network.

upstream accessproof_web {
    server web:3000;
    keepalive 32;
}

upstream accessproof_api {
    server api:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name accessproof.in www.accessproof.in app.accessproof.in api.accessproof.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.accessproof.in;

    # This file must be created by the TLS provider/Certbot and contain the
    # ssl_certificate and ssl_certificate_key directives for these hostnames.
    include /etc/nginx/snippets/accessproof-tls.conf;
    client_max_body_size 20m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://accessproof_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.accessproof.in;

    include /etc/nginx/snippets/accessproof-tls.conf;
    client_max_body_size 20m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://accessproof_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name accessproof.in www.accessproof.in;

    include /etc/nginx/snippets/accessproof-tls.conf;
    return 302 https://app.accessproof.in$request_uri;
}
