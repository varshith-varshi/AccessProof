[project]
name = "accessproof"
version = "0.1.0"
description = "Enterprise AI access-control regression testing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<0.36",
  "pydantic[email]>=2.13,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<0.29",
  "cryptography>=48.0.1,<51",
  "redis>=6,<7",
  "typer>=0.16,<0.17",
  "reportlab>=4.4,<5",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.45.1,<2",
  "PyJWT[crypto]>=2.10,<3",
  # Security floors for transitive dependencies (2026-11 audit)
  "starlette>=1.3.1",
  "certifi>=2026.10.18",
  "pillow>=13.0.0",
  "dnspython>=2.9.0",
]

[project.optional-dependencies]
cache-connectors = ["pymemcache>=4,<5"]
aws-kms = ["boto3>=1.43,<2"]
observability = ["opentelemetry-sdk>=1.36,<2", "opentelemetry-exporter-otlp-proto-http>=1.36,<2"]
dev = [
  "build>=1.3,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "fakeredis>=2,<3",  # isolated ephemeral pairing/discovery API tests
  "pymemcache>=4,<5",  # required by cache-connector security regression tests
  "markdown-it-py[linkify]>=3,<5",  # real-renderer exfiltration tests (R-2 v2)
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
  "types-reportlab>=4.4",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
]

[project.scripts]
accessproof = "packages.client_sdk.cli:app"
accessproof-runner = "apps.runner.accessproof_runner.main:main"
accessproof-guard = "apps.guard.accessproof_guard.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -p no:launch_testing"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", ".venv", "node_modules"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
strict = true

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "connectors*", "integrations*"]
exclude = ["tests*", "docs*", "scripts*"]
