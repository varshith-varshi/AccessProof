<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Library</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#2f5d8a; --ok:#2e7d4f; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1f1d; --ink:#ececea; --muted:#a3a39c; --line:#33332f; --accent:#7fb0e0; --ok:#6fcf97; --bad:#f28b82; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0 auto 0 0; }
  main { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  h2 { font-size:15px; margin:0 0 8px; }
  input, select, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  button { cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  .muted { color:var(--muted); } .ok { color:var(--ok); } .bad { color:var(--bad); }
  #msg { min-height:1.5em; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .table-wrap { overflow-x:auto; }
</style>
</head>
<body>
<header>
  <h1>Smart Library</h1>
  <select id="who" aria-label="Demo member">
    <option value="m-alice">Alice (Finance)</option>
    <option value="m-bob">Bob (Faculty)</option>
    <option value="m-carol">Carol (HR)</option>
    <option value="m-dave">Dave (Student)</option>
    <option value="m-libby">Libby (Librarian)</option>
  </select>
  <button class="primary" id="login">Sign in</button>
  <span id="guard" class="muted"></span>
</header>
<main>
  <div id="msg"></div>
  <section>
    <h2>Catalogue</h2>
    <div class="row"><input id="q" placeholder="Title, author, ISBN or category"><label><input type="checkbox" id="avail"> Available only</label><button id="search">Search</button></div>
    <p class="muted">Only titles you are allowed to use are shown (Guard Layer 1).</p>
    <div class="table-wrap"><table id="books"></table></div>
  </section>
  <section><h2>Recommended for you</h2><div class="table-wrap"><table id="recs"></table></div></section>
  <section><h2>My loans</h2><div class="table-wrap"><table id="loans"></table></div></section>
  <section><h2>My reservations</h2><div class="table-wrap"><table id="resv"></table></div></section>
  <section id="admin" hidden><h2>Librarian dashboard</h2><pre id="stats"></pre><h2>Overdue</h2><div class="table-wrap"><table id="overdue"></table></div></section>
</main>
<script>
let token = null; const att = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((body.detail && (body.detail.detail || body.detail)) || body.error || r.status);
  return body;
}
const say = (t, ok = true) => { $('msg').innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${esc(t)}</span>`; };
const fmt = ts => new Date(ts * 1000).toLocaleDateString();
function bookRows(list) {
  list.forEach(b => att[b.id] = b.attestation);
  return '<tr><th>Title</th><th>Author</th><th>Category</th><th>Available</th><th></th></tr>' + list.map(b =>
    `<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.category)}</td><td>${b.copies_available}/${b.copies_total}</td>
     <td class="row">${b.copies_available > 0 ? `<button data-act="checkout" data-id="${esc(b.id)}">Borrow</button>` : `<button data-act="reserve" data-id="${esc(b.id)}">Reserve</button>`}
     ${b.has_digital ? `<button data-act="read" data-id="${esc(b.id)}">Read</button>` : ''}</td></tr>`).join('');
}
async function refresh() {
  const g = await api('/guard/status'); $('guard').textContent = `Guard ${g.ready ? 'ready' : 'NOT READY'} · policy rev ${g.installed_revision}`;
  if (!token) return;
  $('books').innerHTML = bookRows(await api(`/books?q=${encodeURIComponent($('q').value)}&available=${$('avail').checked}`));
  $('recs').innerHTML = bookRows(await api('/me/recommendations'));
  const loans = await api('/me/loans');
  $('loans').innerHTML = '<tr><th>Title</th><th>Due</th><th>Status</th><th></th></tr>' + loans.map(l =>
    `<tr><td>${esc(l.title)}</td><td>${fmt(l.due_at)}</td><td class="${l.overdue ? 'bad' : ''}">${l.overdue ? 'Overdue, fine ' + l.fine_if_returned_now : 'On loan'}</td>
     <td class="row"><button data-act="renew" data-loan="${l.loan_id}" data-id="${esc(l.book_id)}">Renew</button><button data-act="return" data-loan="${l.loan_id}">Return</button></td></tr>`).join('');
  const rs = await api('/me/reservations');
  $('resv').innerHTML = '<tr><th>Title</th><th>Status</th></tr>' + rs.map(r => `<tr><td>${esc(r.title)}</td><td>${esc(r.status)}</td></tr>`).join('');
  const me = await api('/me'); $('admin').hidden = !me.librarian;
  if (me.librarian) {
    $('stats').textContent = JSON.stringify(await api('/admin/stats'), null, 2);
    $('overdue').innerHTML = '<tr><th>Member</th><th>Title</th><th>Days</th><th>Fine</th></tr>' + (await api('/admin/overdue')).map(o =>
      `<tr><td>${esc(o.member_id)}</td><td>${esc(o.title)}</td><td>${o.days_overdue}</td><td>${o.fine_so_far}</td></tr>`).join('');
  }
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const { act, id, loan } = b.dataset;
  try {
    if (act === 'checkout') { const r = await api(`/books/${id}/checkout`, { method: 'POST', body: JSON.stringify({ attestation: att[id] }) }); say(`Borrowed "${r.title}", due ${fmt(r.due_at)}`); }
    if (act === 'reserve') { const r = await api(`/books/${id}/reserve`, { method: 'POST', body: JSON.stringify({ attestation: att[id] }) }); say(`Reserved, queue position ${r.queue_position}`); }
    if (act === 'read') { const r = await api(`/books/${id}/read`, { method: 'POST', body: JSON.stringify({ attestation: att[id] }) }); say(`${r.title}: ${r.content}`); }
    if (act === 'renew') { const r = await api(`/loans/${loan}/renew`, { method: 'POST', body: JSON.stringify({ attestation: att[id] }) }); say(`Renewed, now due ${fmt(r.due_at)}`); }
    if (act === 'return') { const r = await api(`/loans/${loan}/return`, { method: 'POST' }); say(`Returned${r.fine ? ', fine ' + r.fine : ''}`); }
  } catch (err) { say(err.message, false); }
  refresh();
});
$('login').onclick = async () => { try { token = (await api('/auth/demo-login', { method: 'POST', body: JSON.stringify({ member_id: $('who').value }) })).access_token; say('Signed in'); refresh(); } catch (err) { say(err.message, false); } };
$('search').onclick = refresh;
refresh();
</script>
</body>
</html>
