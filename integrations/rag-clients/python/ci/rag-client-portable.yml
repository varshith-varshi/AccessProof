# Template: copy to .github/workflows/ to enable (needs a token with workflow scope).
name: accessproof-rag portable (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest cryptography "langchain-core>=0.3" "llama-index-core>=0.12"
      - run: python -m pytest -q integrations/rag-clients/python/tests_portable
