services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: accessproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: accessproof
    volumes: [accessproof_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessproof -d accessproof"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [accessproof]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes: [accessproof_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [accessproof]

  api:
    image: ${ACCESSPROOF_API_IMAGE:-accessproof-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      ACCESSPROOF_GOOGLE_OAUTH_CLIENT_ID: ${ACCESSPROOF_GOOGLE_OAUTH_CLIENT_ID:-}
      ACCESSPROOF_GOOGLE_OAUTH_CLIENT_SECRET: ${ACCESSPROOF_GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Single operator-owned Entra multitenant app; consent is tenant-scoped.
      ACCESSPROOF_MICROSOFT_CLIENT_ID: ${ACCESSPROOF_MICROSOFT_CLIENT_ID:-}
      ACCESSPROOF_MICROSOFT_CLIENT_SECRET: ${ACCESSPROOF_MICROSOFT_CLIENT_SECRET:-}
      ACCESSPROOF_ENV: production
      # P0-01: restricted runtime role (falls back to the owner until provisioned;
      # the production security gate fails while the fallback is in use).
      DATABASE_URL: postgresql+psycopg://${ACCESSPROOF_APP_DB_USER:-accessproof}:${ACCESSPROOF_APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/accessproof
      ACCESSPROOF_METRICS_DATABASE_URL: ${ACCESSPROOF_METRICS_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      ACCESSPROOF_PUBLIC_APP_URL: ${ACCESSPROOF_PUBLIC_APP_URL:?set ACCESSPROOF_PUBLIC_APP_URL}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL}
      ACCESSPROOF_ALLOWED_HOSTS: ${ACCESSPROOF_ALLOWED_HOSTS:?set ACCESSPROOF_ALLOWED_HOSTS}
      ACCESSPROOF_FORWARDED_ALLOW_IPS: 172.30.0.10
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:?set SESSION_HMAC_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      REPORT_SIGNING_KEY: ${REPORT_SIGNING_KEY:?set REPORT_SIGNING_KEY}
      ACCESSPROOF_SECRET_BACKEND: local
      ACCESSPROOF_GUARD_RELEASE_VERSION: ${ACCESSPROOF_GUARD_RELEASE_VERSION:-0.1.6}
      # Ed25519 public key(s) of the independent SharePoint certifier (D-01).
      # Never put the certifier's private key here. Empty = no Microsoft source certified.
      ACCESSPROOF_SOURCE_CERTIFICATION_PUBLIC_KEYS_JSON: ${ACCESSPROOF_SOURCE_CERTIFICATION_PUBLIC_KEYS_JSON:-}
      ACCESSPROOF_GATEWAY_OFFLINE_SECONDS: ${ACCESSPROOF_GATEWAY_OFFLINE_SECONDS:-35}
      ACCESSPROOF_EMAIL_MODE: smtp
      ACCESSPROOF_EMAIL_FROM: ${ACCESSPROOF_EMAIL_FROM:?set ACCESSPROOF_EMAIL_FROM}
      ACCESSPROOF_SMTP_HOST: ${ACCESSPROOF_SMTP_HOST:?set ACCESSPROOF_SMTP_HOST}
      ACCESSPROOF_SMTP_PORT: ${ACCESSPROOF_SMTP_PORT:-587}
      ACCESSPROOF_SMTP_USERNAME: ${ACCESSPROOF_SMTP_USERNAME:?set ACCESSPROOF_SMTP_USERNAME}
      ACCESSPROOF_SMTP_PASSWORD: ${ACCESSPROOF_SMTP_PASSWORD:?set ACCESSPROOF_SMTP_PASSWORD}
      ACCESSPROOF_SMTP_STARTTLS: ${ACCESSPROOF_SMTP_STARTTLS:-1}
    command: ["sh", "-c", "python scripts/check_schema.py && uvicorn apps.api.accessproof_api.app:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips 172.30.0.10"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': 'api.accessproof.in'}); urllib.request.urlopen(request)"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [accessproof]

  # Execute once before bringing up/restarting API replicas.  This is the only
  # service allowed to perform schema changes during a deployment.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      ACCESSPROOF_ENV: production
      DATABASE_URL: postgresql+psycopg://accessproof:${POSTGRES_PASSWORD}@db:5432/accessproof
      REDIS_URL: redis://redis:6379/0
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:?set SESSION_HMAC_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      REPORT_SIGNING_KEY: ${REPORT_SIGNING_KEY:?set REPORT_SIGNING_KEY}
    depends_on:
      db: {condition: service_healthy}
    networks: [accessproof]

  worker:
    image: ${ACCESSPROOF_WORKER_IMAGE:-accessproof-worker:latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      ACCESSPROOF_GOOGLE_OAUTH_CLIENT_ID: ${ACCESSPROOF_GOOGLE_OAUTH_CLIENT_ID:-}
      ACCESSPROOF_GOOGLE_OAUTH_CLIENT_SECRET: ${ACCESSPROOF_GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Single operator-owned Entra multitenant app; consent is tenant-scoped.
      ACCESSPROOF_MICROSOFT_CLIENT_ID: ${ACCESSPROOF_MICROSOFT_CLIENT_ID:-}
      ACCESSPROOF_MICROSOFT_CLIENT_SECRET: ${ACCESSPROOF_MICROSOFT_CLIENT_SECRET:-}
      ACCESSPROOF_GOOGLE_WATCH_CALLBACK_URL: ${ACCESSPROOF_GOOGLE_WATCH_CALLBACK_URL:-}
      ACCESSPROOF_GOOGLE_WATCH_CHECK_SECONDS: ${ACCESSPROOF_GOOGLE_WATCH_CHECK_SECONDS:-900}
      ACCESSPROOF_ENV: production
      # P0-01: cross-tenant worker role (owner fallback until provisioned).
      DATABASE_URL: postgresql+psycopg://${ACCESSPROOF_WORKER_DB_USER:-accessproof}:${ACCESSPROOF_WORKER_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/accessproof
      REDIS_URL: redis://redis:6379/0
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      REPORT_SIGNING_KEY: ${REPORT_SIGNING_KEY:?set REPORT_SIGNING_KEY}
      ACCESSPROOF_RLS_BYPASS: "1"
      ACCESSPROOF_EMAIL_MODE: smtp
      ACCESSPROOF_EMAIL_FROM: ${ACCESSPROOF_EMAIL_FROM:?set ACCESSPROOF_EMAIL_FROM}
      ACCESSPROOF_SMTP_HOST: ${ACCESSPROOF_SMTP_HOST:?set ACCESSPROOF_SMTP_HOST}
      ACCESSPROOF_SMTP_PORT: ${ACCESSPROOF_SMTP_PORT:-587}
      ACCESSPROOF_SMTP_USERNAME: ${ACCESSPROOF_SMTP_USERNAME:?set ACCESSPROOF_SMTP_USERNAME}
      ACCESSPROOF_SMTP_PASSWORD: ${ACCESSPROOF_SMTP_PASSWORD:?set ACCESSPROOF_SMTP_PASSWORD}
      ACCESSPROOF_SMTP_STARTTLS: ${ACCESSPROOF_SMTP_STARTTLS:-1}
    depends_on:
      api: {condition: service_healthy}
    networks: [accessproof]

  web:
    # Set ACCESSPROOF_WEB_IMAGE to a release digest.  Never use latest.
    image: ${ACCESSPROOF_WEB_IMAGE:?set ACCESSPROOF_WEB_IMAGE to a digest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      ACCESSPROOF_API_URL: ${ACCESSPROOF_API_URL:-https://api.accessproof.in}
      ACCESSPROOF_API_HOST: ${ACCESSPROOF_API_HOST:-api.accessproof.in}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://app.accessproof.in}
      NEXT_PUBLIC_ENVIRONMENT: production
    depends_on:
      api: {condition: service_healthy}
    networks: [accessproof]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/ec2-https.conf:/etc/nginx/conf.d/default.conf:ro
      - accessproof_letsencrypt:/etc/letsencrypt:ro
      - accessproof_acme:/var/www/certbot:ro
    depends_on:
      - web
      - api
    networks:
      accessproof:
        ipv4_address: 172.30.0.10

networks:
  accessproof:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  accessproof_pg:
  accessproof_redis:
  accessproof_letsencrypt:
    external: true
    name: accessproof_accessproof_letsencrypt
  accessproof_acme:
